name: Test 3D
on:
  workflow_dispatch:
    inputs:
      img_url: { required: true }
      name: { required: false, default: 'test' }
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node scripts/test-3d.mjs
        env:
          IMG_URL: ${{ inputs.img_url }}
      - name: Publier le modèle dans la branche test-assets
        run: |
          git config user.name "wishy-bot"; git config user.email "wishy-bot@users.noreply.github.com"
          mv model.glb /tmp/model.glb
          git fetch origin test-assets || true
          git checkout -B test-assets origin/test-assets 2>/dev/null || git checkout --orphan test-assets
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p models && cp /tmp/model.glb "models/${{ inputs.name }}.glb"
          git add models && git commit -m "Modèle de test ${{ inputs.name }}" && git push -f origin test-assets
